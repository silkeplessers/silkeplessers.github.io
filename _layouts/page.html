<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>{{ page.title }} - {{ site.title }}</title>
        <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
        <meta name="keywords" content="{{ page.tags | join: ', ' }}, {{ page.categories | join: ', ' }}">
        <meta name="author" content="{{ site.author | default: 'Silke Plessers' }}">
        <link rel="stylesheet" href="/assets/style.css">
        <script defer src="/assets/theme.js"></script>
</head>
<body>
        <header class="site-header">
            <div class="container">
                <a class="brand" href="/">{{ site.title }}</a>
                        <nav class="nav">
                            <a href="/">Home</a>
                            <a href="/blog.html">Blog</a>
                            <a href="/about.html">About</a>
                            <button class="theme-toggle" aria-label="Toggle theme" title="Toggle theme">🌓</button>
                        </nav>
            </div>
        </header>
        <main>
            <h1>{{ page.title }}</h1>
            <div>{{ content }}</div>
        </main>
        <footer class="site-footer">
            <p>&copy; {{ site.time | date: "%Y" }} Silke Plessers</p>
        </footer>
</body>
</html>
